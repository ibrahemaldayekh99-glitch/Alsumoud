<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتب الصمود للتحويلات المالية - رأس لانوف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif !important; letter-spacing: 0px !important; }
    body {
      background: radial-gradient(circle at top right, #0b3c78 0%, #041936 55%, #020d1f 100%);
      color: #ffffff;
      overflow-x: hidden;
    }
    .gold-gradient { background: linear-gradient(135deg, #ffe047 0%, #ffcc00 50%, #e5a900 100%); }
    .navy-glass {
      background: rgba(8, 38, 77, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 204, 0, 0.25);
    }
    .rate-card {
      background: linear-gradient(180deg, #092c57 0%, #041730 100%);
      border: 2px solid rgba(255, 204, 0, 0.35);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      transition: all 0.28s ease;
    }
    .rate-card:hover {
      transform: translateY(-6px);
      border-color: #ffcc00;
      box-shadow: 0 16px 35px rgba(255, 204, 0, 0.22);
    }
    .brush-banner {
      background: linear-gradient(90deg, #f5b700 0%, #ffdb3a 50%, #f5b700 100%);
      color: #03152d;
      clip-path: polygon(2% 0%, 98% 3%, 100% 50%, 97% 97%, 1% 100%, 0% 48%);
    }
    .logo-circle {
      background: radial-gradient(circle at 30% 30%, #0a366b 0%, #03152d 85%);
      border: 4px solid #ffffff;
      box-shadow: 0 0 0 3px #06264d, 0 10px 25px rgba(0,0,0,0.6);
    }
  </style>
</head>
